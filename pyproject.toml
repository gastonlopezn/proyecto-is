[project]
name = "proyecto-is"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gastonlopezn", email = "gastonnlopez1412@gmail.com" },
    { name = "jcuvabritos", email = "jcuvabritos@gmail.com"},
    { name = "jmanuelmartin", email = "jmanuelmartinunrc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
proyecto-is = "proyecto_is:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false
