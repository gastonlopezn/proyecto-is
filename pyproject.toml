[project]
name = "proyecto-is"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gastonlopezn", email = "gastonnlopez1412@gmail.com" },
    { name = "jcuvabritos", email = "jcuvabritos@gmail.com"},
    { name = "jmanuelmartin", email = "jmanuelmartinunrc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myapp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
