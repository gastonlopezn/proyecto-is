<form method="post" action="{{ form_action }}">
  <div>
    <label for="title">Title</label>
    <input
      id="title"
      type="text"
      name="title"
      value="{{ question.title if question else '' }}"
      required
    >
  </div>

  <div>
    <label for="body">Body</label>
    <textarea
      id="body"
      name="body"
      required
    >{{ question.body if question else '' }}</textarea>
  </div>

  <div>
    <label for="date">Date</label>
    <input
      id="date"
      type="date"
      name="date"
      value="{{ question.date.strftime('%Y-%m-%d') if question and question.date else '' }}"
      required
    >
  </div>

  <div>
    <label for="source">Source</label>
    <input
      id="source"
      type="text"
      name="source"
      value="{{ (question.source or '') if question else '' }}"
    >
  </div>

  <div>
    <label for="category">Category</label>
    <select id="category" name="category" required>
      {% for cat in categories %}
        <option
          value="{{ cat.title }}"
          {% if question and question.category_title == cat.title %}selected{% endif %}
        >{{ cat.title }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="tags">Tags</label>
    <input
      id="tags"
      type="text"
      name="tags"
      value="{{ question.tags | map(attribute='title') | join(', ') if question else '' }}"
    >
  </div>

  <fieldset>
    <legend>Responses</legend>
    {% set existing_responses = question.responses if question and question.responses else [] %}
    {% for response in existing_responses %}
      <div>
        <label for="response-{{ loop.index }}">Response {{ loop.index }}</label>
        <input
          id="response-{{ loop.index }}"
          type="text"
          name="responses"
          value="{{ response.title }}"
          required
        >
      </div>
    {% endfor %}
    {% for idx in range((existing_responses | length) + 1, 3) %}
      <div>
        <label for="response-{{ idx }}">Response {{ idx }}</label>
        <input
          id="response-{{ idx }}"
          type="text"
          name="responses"
          value=""
          required
        >
      </div>
    {% endfor %}
  </fieldset>

  <button type="submit">{{ submit_label }}</button>
</form>
