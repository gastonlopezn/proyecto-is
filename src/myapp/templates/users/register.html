{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<section class="auth-page" aria-labelledby="register-heading">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      </div>
      <h1 id="register-heading" class="auth-title">Register</h1>
      <p class="auth-subtitle">Create your account to start trading predictions.</p>
    </div>

    {% if error %}
      <div role="alert" class="auth-alert auth-alert--error error-message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form
      method="post"
      action="{{ url_for('users.create') }}"
      class="auth-form"
      data-auth-form
    >
      <div class="auth-field">
        <label for="name" class="auth-label">Full name</label>
        <input
          id="name"
          type="text"
          name="name"
          value="{{ name or '' }}"
          class="auth-input"
          placeholder="Juan Sebastián Leanza"
          autocomplete="name"
          {% if error and not (name or '') %}aria-invalid="true"{% endif %}
          required
        >
      </div>

      <div class="auth-field">
        <label for="email" class="auth-label">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          value="{{ email or '' }}"
          class="auth-input"
          placeholder="you@example.com"
          autocomplete="email"
          {% if error and (not (email or '') or 'already exists' in error) %}aria-invalid="true"{% endif %}
          required
        >
      </div>

      <div class="auth-field">
        <label for="password" class="auth-label">Password</label>
        <div class="auth-password-wrap">
          <input
            id="password"
            type="password"
            name="password"
            class="auth-input"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            {% if error and 'Password' in error %}aria-invalid="true"{% endif %}
            required
          >
          <button
            type="button"
            class="auth-password-toggle"
            data-toggle-password
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg data-icon-show width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg data-icon-hide width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="auth-hint">Must be at least 8 characters.</span>
      </div>

      <button
        type="submit"
        class="auth-submit"
        data-loading-text="Creating account..."
      >Register</button>
    </form>

    <div class="auth-footer">
      Already have an account?
      <a href="{{ url_for('auth.login') }}">Log in</a>
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
{% endblock %}
